[project]
name = "render-svg"
version = "1.0.0"
description = "Render SVGs with metadata and math text"
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.scripts]
render_svg = "render_svg.__main__:app"

[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"
