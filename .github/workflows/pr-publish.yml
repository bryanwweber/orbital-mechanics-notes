name: Publish PR preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to publish
        required: true
        type: number

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    env:
      PYDEVD_DISABLE_FILE_VALIDATION: "1"
      UV_PYTHON: "3.13"
      BASE_URL: /pr-preview/pr-${{ inputs.pr_number }}
      MISE_ENABLE_TOOLS: bun,node,uv
    steps:
      - name: Resolve open PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          jq -e '.state == "open" and .base.ref == "main"' "$RUNNER_TEMP/pr.json"
          echo "sha=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Install locked build tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: bun node uv --locked
      - name: Install image conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes webp imagemagick
      - name: Check the Python lock file
        run: uv lock --check
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Build the book
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen bun run book:build --strict --ci 2>&1 | tee "$RUNNER_TEMP/book-build.log"
          # MyST 1.13 strict mode only fails on errors, so reject warnings too.
          # Include Node runtime warnings emitted by the theme's build process.
          # Ignore the known url.parse deprecation and unavailable localStorage warnings.
          # Keep both in the original log so we can track their upstream resolution.
          # shellcheck disable=SC2016 # Match literal backticks in Node's message.
          sed -E \
            -e '/^\(node:[0-9]+\) \[DEP0169\] DeprecationWarning: `url\.parse\(\)` /d' \
            -e '/^\(node:[0-9]+\) ExperimentalWarning: localStorage is not available because --localstorage-file was not provided\.$/d' \
            "$RUNNER_TEMP/book-build.log" > "$RUNNER_TEMP/book-build-checked.log"
          if grep -E '⚠|(^|[[:space:]])WARN(ING)?([[:space:]:]|$)|[[:alnum:]]*Warning:' "$RUNNER_TEMP/book-build-checked.log"; then
            echo "::error::Book build emitted warnings; refusing to publish."
            exit 1
          fi
      - name: Generate legacy HTML redirects
        run: bun run book:redirects
      - name: Verify static output
        run: |
          test -s _build/html/index.html
          bun run test:url-root
          bun run test:redirects
          bun run book:check-urls
      - name: Upload the book
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book-html
          path: _build/html/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max
    steps:
      # Only trusted main-branch scripts run in this job with write access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check PR is still open
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [[ "$state" != open ]]; then
            echo "PR is closed; skipping preview publication." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download preview
        if: steps.pr.outputs.state == 'open'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: book-html
          path: _build/preview-html
      - name: Prevent preview indexing
        if: steps.pr.outputs.state == 'open'
        run: |
          node --input-type=module - _build/preview-html <<'JS'
          import assert from "node:assert/strict";
          import { readdir, readFile, writeFile } from "node:fs/promises";
          import path from "node:path";

          // Run only on the downloaded preview artifact, never on the production build.
          async function preventPreviewIndexing(root) {
            let count = 0;
            async function visit(directory) {
              for (const entry of await readdir(directory, { withFileTypes: true })) {
                const file = path.join(directory, entry.name);
                assert.ok(!entry.isSymbolicLink(), `Unexpected symlink in preview: ${file}`);
                if (entry.isDirectory()) {
                  await visit(file);
                } else if (/\.html?$/i.test(entry.name)) {
                  const html = await readFile(file, "utf8");
                  count += 1;
                  // Figures already declare their permanent indexing policy.
                  // Preserve indexifembedded and avoid duplicate robots tags.
                  const protectedPage = [...html.matchAll(/<meta\b[^>]*>/gi)].some(([tag]) => {
                    if (!/\bname\s*=\s*(["'])robots\1/i.test(tag)) return false;
                    const content = tag.match(/\bcontent\s*=\s*(["'])(.*?)\1/i)?.[2];
                    const rules = content?.toLowerCase().split(/[\s,]+/) ?? [];
                    return rules.includes("none") || (rules.includes("noindex") && rules.includes("nofollow"));
                  });
                  if (protectedPage) continue;
                  // HTML permits an omitted head tag. A meta tag immediately
                  // after html becomes part of the browser's implicit head.
                  const insertionPoint = /<head\b[^>]*>/i.test(html)
                    ? /<head\b[^>]*>/i : /<html\b[^>]*>/i;
                  assert.match(html, insertionPoint, `Missing HTML document: ${file}`);
                  const updated = html.replace(insertionPoint,
                    '$&\n<meta name="robots" content="noindex, nofollow">');
                  await writeFile(file, updated);
                }
              }
            }
            await visit(root);
            assert.ok(count > 0, "No preview HTML found");
            return count;
          }

          console.log(await preventPreviewIndexing(process.argv[2]));
          JS
      - name: Publish preview
        if: steps.pr.outputs.state == 'open'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: _build/preview-html
          target-folder: pr-preview/pr-${{ inputs.pr_number }}
          force: false
      - name: Report preview URL
        if: steps.pr.outputs.state == 'open'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          echo "Preview: https://orbital-mechanics.space/pr-preview/pr-$PR_NUMBER/" >> "$GITHUB_STEP_SUMMARY"
