name: deploy-book

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYDEVD_DISABLE_FILE_VALIDATION: "1"
  UV_PYTHON: "3.13"
  # The custom domain serves the book at its root, without a repository prefix.
  BASE_URL: ""
  MISE_ENABLE_TOOLS: bun,node,uv

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install locked build tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: bun node uv --locked
      - name: Install image conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes webp imagemagick
      - name: Check the Python lock file
        run: uv lock --check
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Build the book
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen bun run book:build --strict --ci 2>&1 | tee "$RUNNER_TEMP/book-build.log"
          # MyST 1.13 strict mode only fails on errors, so reject warnings too.
          # Include Node runtime warnings emitted by the theme's build process.
          # Ignore the known url.parse deprecation and unavailable localStorage warnings.
          # Keep both in the original log so we can track their upstream resolution.
          # shellcheck disable=SC2016 # Match literal backticks in Node's message.
          sed -E \
            -e '/^\(node:[0-9]+\) \[DEP0169\] DeprecationWarning: `url\.parse\(\)` /d' \
            -e '/^\(node:[0-9]+\) ExperimentalWarning: localStorage is not available because --localstorage-file was not provided\.$/d' \
            "$RUNNER_TEMP/book-build.log" > "$RUNNER_TEMP/book-build-checked.log"
          if grep -E '⚠|(^|[[:space:]])WARN(ING)?([[:space:]:]|$)|[[:alnum:]]*Warning:' "$RUNNER_TEMP/book-build-checked.log"; then
            echo "::error::Book build emitted warnings; refusing to publish."
            exit 1
          fi
      - name: Verify static output
        run: |
          test -s _build/html/index.html
          bun run test:url-root
          bun run book:check-urls
      - name: Upload the book
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book-html
          path: _build/html/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    name: Publish the book
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Push the built site to the gh-pages branch.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the book
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: book-html
          path: _build/html
      - name: Prepare Pages metadata
        run: |
          echo orbital-mechanics.space > _build/html/CNAME
          touch _build/html/.nojekyll
      - name: Publish to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: _build/html
          clean-exclude: pr-preview/
          force: false
