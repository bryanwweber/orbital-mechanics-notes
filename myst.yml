version: 1
project:
  plugins:
    - type: javascript
      path: inlineHTML.mjs
  static_files:
    - assets/
  jupyter: false
  title: Orbital Mechanics & Astrodynamics
  authors:
    - name: Bryan Weber
      orcid: "0000-0003-0815-9270"
      email: "bryan@bryanwweber.com"
      github: bryanwweber
      url: https://bryanwweber.com
  exclude:
    - interplanetary-maneuvers/planetary-depahture-trajectory.md
    - homework
    - raw_svg
    - drawing-scripts
    - docker
    - assets
    - blender
    - chapter-4
    - .venv
    - .pytest_cache
    - INSTALL.md
    - vendor
    - Project.toml
    - Manifest.toml
  bibliography:
    - references.bib
  license: CC-BY-4.0
  open_access: true
  github: bryanwweber/orbital-mechanics-notes
  math:
    '\vector': "\\boldsymbol{#1}"
    '\uvec': "\\boldsymbol{\\hat{#1}}"
    '\mag': "\\lVert#1\\rVert"
    '\cross': "\\times"
    '\unit': "#1~\\mathrm{#2}"
    '\pf': "{#1}_{\\omega}" # This is for the perifocal frame
    '\mat': "\\left[\\mathbf{#1}\\right]" # A matrix
    '\COG': "\\mathrm{COG}" # Center of gravity
    '\KE': "\\mathrm{KE}" # Kinetic energy
    '\PE': "V" # Potential energy
  numbering:
    figure:
      template: Fig. %s
      continue: true
    equation:
      template: Eq. %s
      continue: true

