[tools]
jactionlint             = "2.6.0"
biome                   = "latest"
bun                     = "latest"
julia                   = "latest"
node                    = "26"
"npm:markdownlint-cli2" = "latest"
shellcheck              = "0.11.0"
taplo                   = "latest"
uv                      = "latest"
watchexec               = "latest"
zizmor                  = "latest"

[tool_alias]
julia = "asdf:rkyleg/asdf-julia"

[settings]
lockfile = true
npm      = { bun = true }

[tasks.format]
depends     = ["markdownlint_format", "ruff_check_format", "ruff_format_format"]
description = "Run all the formatting tools"
env         = { MISE_JOBS = "1" }

[tasks.build]
description = "Build the static book in _build/html"
run         = "uv run --frozen bun run book:build"

[tasks.serve]
description = "Preview the book with live reload"
run         = "uv run --frozen bun run book:dev"

[tasks.julia]
depends     = ["julia_install"]
description = "Upgrade and install Julia dependencies"
env         = { MISE_JOBS = "1" }

[tasks.julia_install]
depends     = ["julia_upgrade"]
description = "Install Julia dependencies"
run         = "julia --project=. -e 'using Pkg; Pkg.instantiate()'"

[tasks.julia_upgrade]
description = "Upgrade Julia dependencies"
run         = "julia --project=. -e 'using Pkg; Pkg.update()'"

[tasks.lint]
depends     = ["ci-lint", "zizmor"]
description = "Run all the linter tools"
env         = { MISE_JOBS = "1" }

[tasks.ci-lint]
depends     = ["actionlint", "biome_lint", "markdownlint_lint", "ruff_check_lint", "ruff_format_lint"]
description = "Run CI linters; zizmor runs as a separate GitHub Action"
env         = { MISE_JOBS = "1" }

[tasks.zizmor]
description = "Analyze GitHub Actions security"
run         = "zizmor .github/workflows"

[tasks.actionlint]
description = "Lint GitHub Actions workflows and their shell scripts"
run         = "jactionlint --profile correctness"

[tasks.biome_lint]
description = "Lint JavaScript plugins with Biome"
run         = "biome lint --error-on-warnings plugins/*.mjs"

[tasks.markdownlint_format]
description = "Run markdownlint in fix mode"
run         = "markdownlint-cli2 --fix"

[tasks.markdownlint_lint]
description = "Run markdownlint"
run         = "markdownlint-cli2"

[tasks.ruff_check_format]
description = "Run the ruff linter in fix mode"
run         = "ruff check --fix ."

[tasks.ruff_check_lint]
description = "Run the ruff linter"
run         = "uv run --frozen ruff check ."

[tasks.ruff_format_format]
description = "Run the ruff formatter"
run         = "ruff format ."

[tasks.ruff_format_lint]
description = "Run the ruff formatter in check mode"
run         = "uv run --frozen ruff format --check ."
